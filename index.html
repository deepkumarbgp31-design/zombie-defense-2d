<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zombie Defense 2D</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container" id="game-container">
        <h1>ZOMBIE DEFENSE 2D</h1>
        
        <div id="game-screen" class="screen active">
            <div class="hud">
                <div class="hp">HP: <span id="hp-val">100%</span></div>
                <div class="score">SCORE: <span id="score-val">0 / 50</span></div>
            </div>

            <div class="battlefield">
                <div class="lane" onclick="selectLane(0)">
                    <div id="p-0" class="player-space"></div>
                    <div id="t-0" class="track-space"></div>
                </div>
                <div class="lane" onclick="selectLane(1)">
                    <div id="p-1" class="player-space"></div>
                    <div id="t-1" class="track-space"></div>
                </div>
                <div class="lane" onclick="selectLane(2)">
                    <div id="p-2" class="player-space"></div>
                    <div id="t-2" class="track-space"></div>
                </div>
            </div>

            <!-- Touch & Mouse Controls -->
            <div class="mobile-controls">
                <div class="move-btns">
                    <button type="button" class="ctrl-btn" id="btn-up" aria-label="Move Up">▲ UP</button>
                    <button type="button" class="ctrl-btn" id="btn-down" aria-label="Move Down">▼ DOWN</button>
                </div>
                <button type="button" class="ctrl-btn fire-btn" id="btn-fire" aria-label="Fire Gun">🔥 FIRE</button>
            </div>

            <div class="controls">
                <strong>Desktop:</strong> W / S (or Arrows) to Move • Spacebar to Shoot<br>
                <strong>Touch:</strong> Tap any lane or use buttons above
            </div>
        </div>

        <div id="end-screen" class="screen">
            <div id="end-message"></div>
            <button type="button" class="btn" onclick="resetGame()">Play Again</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
