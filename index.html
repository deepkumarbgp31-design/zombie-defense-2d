<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zombie Defense 2D</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container" class="game-container">
        <h1>ZOMBIE DEFENSE 2D</h1>

        <!-- Active Game Screen -->
        <div id="game-screen" class="screen active">
            <div class="hud">
                <div>HP: <span id="hp-val" class="hp">100%</span></div>
                <div>SCORE: <span id="score-val" class="score">0 / 50</span></div>
            </div>

            <!-- Play/Pause, Reset & Exit Controls -->
            <div class="game-actions">
                <button id="btn-pause" class="action-btn">⏸ PAUSE</button>
                <button id="btn-reset" class="action-btn">🔄 RESET</button>
                <button id="btn-exit" class="action-btn exit-btn">🚪 EXIT</button>
            </div>

            <!-- 3-Lane Battlefield -->
            <div id="battlefield" class="battlefield">
                <div class="lane" onclick="selectLane(0)">
                    <div id="p-0" class="player-space"></div>
                    <div id="t-0" class="track-space"></div>
                </div>
                <div class="lane" onclick="selectLane(1)">
                    <div id="p-1" class="player-space"></div>
                    <div id="t-1" class="track-space"></div>
                </div>
                <div class="lane" onclick="selectLane(2)">
                    <div id="p-2" class="player-space"></div>
                    <div id="t-2" class="track-space"></div>
                </div>
            </div>

            <!-- Touch & Mouse Controls -->
            <div class="mobile-controls">
                <div class="move-btns">
                    <button id="btn-up" class="ctrl-btn">▲ UP</button>
                    <button id="btn-down" class="ctrl-btn">▼ DOWN</button>
                </div>
                <button id="btn-fire" class="ctrl-btn fire-btn">🔥 FIRE</button>
            </div>

            <div class="controls">
                <strong>Desktop:</strong> W / S (or Arrows) to Move • Spacebar to Shoot • P to Pause<br>
                <strong>Touch:</strong> Tap any lane or use buttons above
            </div>
        </div>

        <!-- Victory / Game Over Screen -->
        <div id="end-screen" class="screen">
            <div id="end-message"></div>
            <button id="btn-play-again" class="btn">Play Again</button>
        </div>

        <!-- Exit Screen -->
        <div id="exit-screen" class="screen">
            <div class="lose-msg">🚪 GAME EXITED</div>
            <p>Thanks for holding the line against the horde!</p>
            <button id="btn-relaunch" class="btn">▶ Start New Game</button>
        </div>
    </div>
    <!-- TOP BAR -->
<div class="top-bar">
    <button id="btn-pause-top" class="top-btn">⏸ PAUSE</button>
    <button id="btn-exit-top" class="top-btn exit-x">✖</button>
</div>

<!-- ... HUD, Battlefield, and Up/Down/Fire buttons ... -->

<!-- BOTTOM BAR -->
<div class="bottom-bar">
    <button id="btn-reset-bottom" class="bottom-btn reset-btn">🔄 RESET</button>
    <button id="btn-play-bottom" class="bottom-btn play-btn">⏸ PAUSE</button>
</div>
<div id="exit-screen" class="screen">
    <div class="lose-msg">🚪 GAME EXITED</div>
    <p>Thanks for holding the line against the horde!</p>
    <button id="btn-relaunch" class="btn">▶ Start New Game</button>
</div>


    <script src="script.js"></script>
</body>
</html>
